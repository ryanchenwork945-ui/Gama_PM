name: Sync Google Drive → GitHub Pages

on:
  # 每天台灣時間 08:00 自動同步（UTC+8 = UTC 00:00）
  schedule:
    - cron: '0 0 * * *'
  # 手動觸發（Repo → Actions → Run workflow）
  workflow_dispatch:

permissions:
  contents: write  # 允許 commit & push

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安裝依賴
      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      # 4. 執行同步腳本
      - name: Sync data from Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_drive.py

      # 5. 如果有變更就 commit & push
      - name: Commit & push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "✅ 資料無變更，略過 commit"
          else
            MONTH=$(date +%Y/%m)
            git stash
            git pull --rebase origin main
            git stash pop
            git add data/
            git commit -m "chore: sync report data ${MONTH} [skip ci]"
            git push
            echo "🚀 已推送更新"
          fi

      # 失敗通知：上面任一步失敗就推 Telegram（需要 repo secrets TG_TOKEN、TG_CHAT_ID）
      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG=$(printf '⚠️ GitHub Actions 失敗\nrepo: %s\nworkflow: %s\n%s' "$REPO" "$WORKFLOW" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
